[package]
name = "whatsapp-desktop"
version = "0.3.5"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-utils = "2"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2"
